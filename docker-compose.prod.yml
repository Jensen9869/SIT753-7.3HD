services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cakeshop_prod
      POSTGRES_USER: cakeshop
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prodpassword}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cakeshop"]
      interval: 5s
      retries: 5

  web:
    image: cake-shop:${IMAGE_TAG:-latest}
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgres://cakeshop:stagingpassword@db:5432/cakeshop_staging
      DEBUG: "False"
      SECRET_KEY: staging-key-not-for-production
      ENVIRONMENT: staging
      ALLOWED_HOSTS: "localhost,127.0.0.1,web,0.0.0.0,host.docker.internal"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  prod_pgdata: