services:
  db:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: ...
      DEBUG: "False"
      SECRET_KEY: ...
      ENVIRONMENT: production
      ALLOWED_HOSTS: "localhost,127.0.0.1,web,0.0.0.0,host.docker.internal"
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cakeshop"]
      interval: 5s
      retries: 5

  web:
    image: cake-shop:${IMAGE_TAG:-latest}
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgres://cakeshop:${DB_PASSWORD:-prodpassword}@db:5432/cakeshop_prod
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-prod-key-change-me}
      ENVIRONMENT: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  prod_pgdata: