services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cakeshop
      POSTGRES_USER: cakeshop
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cakeshop"]
      interval: 5s
      retries: 5
  
  web:
    image: cake-shop:${IMAGE_TAG:-latest}
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0:8000 --workers 3"

    ports:
      - "8000:8000"
    
    environment:
      DATABASE_URL: postgres://cakeshop:devpassword@db:5432/cakeshop
      DEBUG: "FALSE"
      SECRET_KEY: docker-dev-key-not-for-production
    
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: