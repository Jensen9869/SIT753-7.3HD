groups:
  - name: cake-shop-alerts
    rules:
      - alert: ApplicationDown
        expr: up{job="cake-shop-prod"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Production application is not responding"
          description: "Prometheus has been unable to scrape the production app for over a minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]))
          /
          sum(rate(django_http_responses_total_by_status_total[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are returning 5xx"

      - alert: SlowResponses
        expr: |
          histogram_quantile(0.95,
            sum(rate(django_http_requests_latency_seconds_by_view_method_bucket[5m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile response time is above one second"